<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diretoria Esperanto Brasil</title>
<!--
CONFIGURAÇÃO (veja o objeto CONFIG no final do arquivo):
1. console.firebase.google.com → criar projeto → Authentication → ativar "Google".
2. Firestore Database → criar. Regras sugeridas (troque os e-mails):
   rules_version='2';
   service cloud.firestore { match /databases/{d}/documents { match /topics/{t} {
     allow read, write: if request.auth != null && request.auth.token.email in ['presidente@exemplo.org','tesouraria@exemplo.org'];
   }}}
3. Configurações do projeto → app Web → copie o firebaseConfig para CONFIG.firebase.
Sem configuração, o site roda em MODO DEMO (dados só no seu navegador).
-->
<style>
:root{--g:#0d9488;--gd:#115e59;--gl:#e0f4f1;--bg:#f3f7f7;--card:#fff;--tx:#14282a;--mu:#617779;--bd:#d8e5e5;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--g:#2dd4bf;--gd:#0f4f4c;--gl:#173a3a;--bg:#0e1819;--card:#16252a;--tx:#e4f1f1;--mu:#92abac;--bd:#27403f}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font:inherit;color:inherit}a{color:var(--g)}
header{background:linear-gradient(90deg,var(--gd),#0f766e);color:#fff;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 20px}
header .logo{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;white-space:nowrap}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
#q{flex:1;max-width:420px;margin-left:auto;padding:8px 14px;border-radius:20px;border:0;background:rgba(255,255,255,.18);color:#fff}
#q::placeholder{color:#d5f0ed}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
:root:not(.x) .btn{color:#fff}@media(prefers-color-scheme:dark){.btn{color:#08201f}.btn.ghost{color:var(--g)}}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--bd)}
.btn.w{background:#fff;color:var(--gd)}.btn.sm{padding:3px 10px;font-size:13px}.danger{color:var(--red)!important}
.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;object-fit:cover;flex:none}
.wrap{max-width:1080px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:240px 1fr;gap:20px}
aside .box,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
aside h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--mu);letter-spacing:.06em}
.cat{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer}
.cat:hover,.cat.on{background:var(--gl)}.cat.on{color:var(--g);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tabs .btn{padding:5px 12px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row:hover{background:var(--gl)}.row h3{margin:0;font-size:17px}.meta{font-size:13px;color:var(--mu)}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--gl);color:var(--g);font-weight:700;margin-right:4px}
.stats{margin-left:auto;text-align:right;font-size:13px;color:var(--mu);white-space:nowrap}
.list{padding:0;overflow:hidden}.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.body{white-space:pre-wrap;word-wrap:break-word;margin:12px 0}
.opt{position:relative;display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:none;cursor:pointer;overflow:hidden}
.opt i{position:absolute;left:0;top:0;bottom:0;background:var(--gl)}.opt span{position:relative;display:flex;justify-content:space-between}
.opt.me{border-color:var(--g);font-weight:700}
.cm{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
input.f,textarea.f,select.f{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:5px 0}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{width:100%;max-width:560px;max-height:92vh;overflow:auto}
.hero{text-align:center;padding:60px 20px}.hero h1{color:var(--g);margin:10px 0 4px}
.due{color:var(--red);font-weight:700}.empty{text-align:center;color:var(--mu);padding:40px}
.banner{background:var(--gl);border-left:4px solid var(--g);padding:10px 14px;border-radius:8px;margin:10px 0}
.h{font-size:13px;padding:5px 0;border-left:2px solid var(--bd);padding-left:12px;margin-left:6px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--g)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{order:2}header small{display:none}.stat{grid-template-columns:1fr 1fr}}
@media print{header,aside,.noprint,.tabs{display:none!important}.wrap{display:block}.card{border:0}}
</style>
</head>
<body>
<header>
 <div class="logo" onclick="go('')"><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M16 5l3 8.6h9l-7.3 5.3 2.8 8.6L16 22.2l-7.5 5.3 2.8-8.6L4 13.6h9z" fill="#0d9488"/></svg>
 <div>Diretoria Esperanto Brasil<small>Liga Brasileira de Esperanto · espaço interno</small></div></div>
 <input id="q" placeholder="Buscar em tudo…" oninput="S.q=this.value;if(location.hash)go('');else render();$('q').focus()">
 <div id="me"></div>
</header>
<div id="app"></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CONFIG={
 firebase:null, // cole aqui o firebaseConfig: {apiKey:"…",authDomain:"…",projectId:"…",appId:"…"}
 admins:[],     // e-mails que podem fixar/encerrar/arquivar/apagar qualquer item
 allowed:[]     // e-mails autorizados (vazio = qualquer conta Google; use também as regras do Firestore!)
};
const TYPES={topic:'💬 Tópico',poll:'📊 Enquete',reminder:'⏰ Lembrete'};
const VIEWS={andamento:'📂 Em andamento',lembretes:'⏰ Lembretes pendentes',antigos:'🗃 Lembretes antigos',arquivados:'📦 Arquivados',meus:'👤 Meus / atribuídos a mim'};
const S={user:null,topics:[],view:'andamento',q:'',type:'all',sort:'act'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>e(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)@([\wÀ-ÿ.-]+)/g,'$1<span class="tag">@$2</span>');
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const fd=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR');
const today=()=>new Date().toISOString().slice(0,10);
function ago(t){const m=(Date.now()-t)/6e4;if(m<1)return'agora';if(m<60)return Math.floor(m)+' min';if(m<1440)return Math.floor(m/60)+' h';return new Date(t).toLocaleDateString('pt-BR')}
const isAdmin=()=>S.user&&CONFIG.admins.includes(S.user.email);
const av=u=>u.photo?`<img class="av" src="${e(u.photo)}" referrerpolicy="no-referrer" alt="">`:`<span class="av">${e((u.name||'?')[0])}</span>`;
const seen=()=>JSON.parse(localStorage['seen_'+S.user.uid]||'{}');

/* ---------- Camada de dados (Firebase ou demo local) ---------- */
let store,login,logout;
if(CONFIG.firebase&&typeof firebase!=='undefined'){
 firebase.initializeApp(CONFIG.firebase);
 const col=firebase.firestore().collection('topics'),au=firebase.auth();
 store={sub:cb=>col.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  add:o=>col.add(o),upd:(id,p)=>col.doc(id).update(p),del:id=>col.doc(id).delete()};
 login=()=>au.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x=>alert(x.message));
 logout=()=>au.signOut();
 au.onAuthStateChanged(u=>{
  if(u&&CONFIG.allowed.length&&!CONFIG.allowed.includes(u.email)){alert('Esta conta Google não está autorizada.');au.signOut();return}
  S.user=u?{uid:u.uid,name:u.displayName,email:u.email,photo:u.photoURL}:null;
  if(u)store.sub(t=>{S.topics=t;render()});render()});
}else{
 let d=JSON.parse(localStorage.lbe2||'[]'),cbs=[];
 const me={uid:'demo',name:'Diretor(a) Demo',email:'demo@lbe.org.br'};
 const save=()=>{localStorage.lbe2=JSON.stringify(d);cbs.forEach(f=>f(d.slice()))};
 store={sub:cb=>{cbs.push(cb);save()},add:o=>{d.push({id:uid(),...o});save()},upd:(id,p)=>{Object.assign(d.find(x=>x.id==id),p);save()},del:id=>{d=d.filter(x=>x.id!=id);save()}};
 login=()=>{S.user=me;store.sub(t=>{S.topics=t;render()})};logout=()=>{S.user=null;render()};
}

/* ---------- Navegação ---------- */
const go=h=>{location.hash=h;render()};
addEventListener('hashchange',render);
const T=id=>S.topics.find(t=>t.id==id),who=()=>({uid:S.user.uid,name:S.user.name,email:S.user.email,photo:S.user.photo||''});
const people=()=>{const m={};S.topics.forEach(t=>{m[t.author.uid]=t.author.name;(t.comments||[]).forEach(c=>m[c.author.uid]=c.author.name)});m[S.user.uid]=S.user.name;return Object.entries(m)};
function render(){
 $('me').innerHTML=S.user?`<div style="display:flex;gap:10px;align-items:center">${av(S.user)}<b style="font-size:14px">${e(S.user.name.split(' ')[0])}</b><button class="btn w sm" onclick="logout()">Sair</button></div>`:'';
 if(!S.user){$('app').innerHTML=`<div class="hero"><svg width="72" height="72" viewBox="0 0 32 32"><path d="M16 2l3.5 10.5H30l-8.5 6.2 3.2 10L16 22.4 7.3 28.7l3.2-10L2 12.5h10.5z" fill="#0d9488"/></svg>
  <h1>Diretoria Esperanto Brasil</h1><p class="meta" style="font-size:16px">Espaço reservado à diretoria da Liga Brasileira de Esperanto.<br>Entre com sua conta Google para participar.</p>
  <button class="btn" style="padding:12px 26px;font-size:17px" onclick="login()">Entrar com Google</button>
  ${CONFIG.firebase?'':'<p class="meta">⚠ Modo demonstração: dados salvos só neste navegador.</p>'}</div>`;return}
 const m=location.hash.match(/^#t\/(.+)/),t=m&&T(m[1]);
 if(t){const s=seen();s[t.id]=t.act||t.ts;localStorage['seen_'+S.user.uid]=JSON.stringify(s)}
 $('app').innerHTML=`<div class="wrap"><aside>${side()}</aside><main>${t?detail(t):list()}</main></div>`;
}
const arch=t=>!!t.archived,isRem=t=>t.type=='reminder';
const inView=(t,v)=>({
 andamento:!arch(t)&&!(isRem(t)&&t.done),
 lembretes:isRem(t)&&!t.done&&!arch(t),
 antigos:isRem(t)&&t.done&&!arch(t),
 arquivados:arch(t),
 meus:!arch(t)&&(t.author.uid==S.user.uid||t.assignee?.uid==S.user.uid)})[v];
function side(){
 const rem=S.topics.filter(t=>inView(t,'lembretes')&&t.due).sort((a,b)=>a.due>b.due?1:-1).slice(0,4);
 return `<button class="btn" style="width:100%;margin-bottom:14px" onclick="compose()">＋ Novo</button>
 <div class="box"><h4>Navegar</h4>${Object.entries(VIEWS).map(([k,v])=>`<button class="cat ${S.view==k?'on':''}" onclick="S.view='${k}';go('')">${v}<span class="meta">${S.topics.filter(t=>inView(t,k)).length}</span></button>`).join('')}</div>
 <div class="box"><h4>⏰ Próximos prazos</h4>${rem.length?rem.map(r=>`<div style="margin:6px 0;cursor:pointer" onclick="go('t/${r.id}')"><b>${e(r.title)}</b><div class="meta ${r.due<today()?'due':''}">${r.due<today()?'Vencido · ':''}${fd(r.due)}${r.assignee?' · '+e(r.assignee.name.split(' ')[0]):''}</div></div>`).join(''):'<span class="meta">Nenhum pendente 🎉</span>'}</div>`;
}
function list(){
 const q=S.q.toLowerCase(),v=S.view,sd=seen();
 let L=S.topics.filter(t=>inView(t,v)&&(S.type=='all'||t.type==S.type)&&(!q||(t.title+t.body+t.author.name+(t.comments||[]).map(c=>c.text).join(' ')).toLowerCase().includes(q)));
 L.sort((a,b)=>v=='lembretes'?(a.due>b.due?1:-1):v=='antigos'?(b.done.at-a.done.at):v=='arquivados'?(b.archived.at-a.archived.at):(b.pinned?1:0)-(a.pinned?1:0)||(S.sort=='act'?(b.act||b.ts)-(a.act||a.ts):b.ts-a.ts));
 const mine=S.topics.filter(t=>inView(t,'lembretes')&&t.due<today()).length;
 return `<div class="stat noprint"><div><b>${S.topics.filter(t=>inView(t,'andamento')).length}</b>em andamento</div><div><b>${S.topics.filter(t=>inView(t,'lembretes')).length}</b>lembretes</div><div><b class="${mine?'due':''}">${mine}</b>vencidos</div><div><b>${S.topics.filter(t=>t.type=='poll'&&!t.closed&&!arch(t)).length}</b>enquetes abertas</div></div>
 <h2 style="margin:0 0 10px">${VIEWS[v]}</h2>
 <div class="tabs">${[['all','Tudo'],...Object.entries(TYPES)].map(([k,x])=>`<button class="btn ${S.type==k?'':'ghost'}" onclick="S.type='${k}';render()">${x}</button>`).join('')}
 <select class="f" style="width:auto;margin:0 0 0 auto" onchange="S.sort=this.value;render()"><option value="act" ${S.sort=='act'?'selected':''}>Atividade recente</option><option value="new" ${S.sort=='new'?'selected':''}>Mais novos</option></select></div>
 <div class="card list">${L.length?L.map(t=>{const un=(t.act||t.ts)>(sd[t.id]||0)&&t.author.uid!=S.user.uid||(t.act||t.ts)>(sd[t.id]||0)&&sd[t.id];
 return `<div class="row" onclick="go('t/${t.id}')">${un?'<span class="dot" title="Novidades"></span>':'<span style="width:9px"></span>'}${av(t.author)}<div><h3>${t.pinned?'📌 ':''}${e(t.title)}</h3>
 <div class="meta">${TYPES[t.type]} · ${e(t.author.name)} · ${ago(t.ts)}${t.due?` · prazo <span class="${!t.done&&t.due<today()?'due':''}">${fd(t.due)}</span>`:''}${t.assignee?' · 👤 '+e(t.assignee.name):''}${t.done?` · ✔ ${e(t.done.by.name)}, ${fmt(t.done.at)}`:''}${t.closed&&!arch(t)?' · 🔒 encerrado':''}${arch(t)?` · 📦 ${e(t.archived.by.name)}, ${fmt(t.archived.at)}`:''}</div></div>
 <div class="stats">💬 ${(t.comments||[]).length}<br>👍 ${(t.likes||[]).length}</div></div>`}).join(''):'<div class="empty">Nada por aqui ainda.</div>'}</div>`;
}
function detail(t){
 const u=S.user,can=isAdmin()||t.author.uid==u.uid,liked=(t.likes||[]).includes(u.uid),off=t.closed||arch(t);
 let extra='';
 if(t.type=='poll'){const tot=t.options.reduce((s,o)=>s+o.v.length,0);
  extra=t.options.map((o,i)=>`<button class="opt ${o.v.some(x=>x.startsWith(u.uid+'|'))?'me':''}" ${off?'disabled':''} onclick="vote('${t.id}',${i})"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span>${e(o.t)}<b>${o.v.length} voto(s)</b></span></button>`).join('')+`<div class="meta">${tot} voto(s) · votos nominais${t.options.map(o=>o.v.length?`<br>${e(o.t)}: ${o.v.map(x=>e(x.split('|')[1])).join(', ')}`:'').join('')}</div>`}
 if(isRem(t))extra=`<p>📅 Prazo: <b class="${!t.done&&t.due<today()?'due':''}">${fd(t.due)}</b>${t.assignee?` · 👤 Responsável: <b>${e(t.assignee.name)}</b>`:''}</p>
  ${t.done?`<div class="banner">✔ Concluído por <b>${e(t.done.by.name)}</b> em ${fmt(t.done.at)} <button class="btn ghost sm" onclick="undo('${t.id}')">Reabrir</button></div>`:`<button class="btn" onclick="done('${t.id}')" ${arch(t)?'disabled':''}>✔ Marcar como concluído</button>`}`;
 const hist=[...(t.hist||[])].reverse().map(h=>`<div class="h"><b>${e(h.by)}</b> ${e(h.txt)} <span class="meta">· ${fmt(h.ts)}</span></div>`).join('');
 return `<button class="btn ghost sm noprint" onclick="go('')">← Voltar</button>
 <div class="card" style="margin-top:12px"><div style="display:flex;gap:12px;align-items:center">${av(t.author)}<div>${TYPES[t.type]}<div class="meta">${e(t.author.name)} · ${fmt(t.ts)}${t.edited?` · editado ${fmt(t.edited)}`:''}</div></div></div>
 <h2>${t.pinned?'📌 ':''}${e(t.title)}</h2>
 ${arch(t)?`<div class="banner">📦 Encerrado e arquivado por <b>${e(t.archived.by.name)}</b> em ${fmt(t.archived.at)}${t.archived.note?`<br><b>Conclusão:</b> ${rich(t.archived.note)}`:''}</div>`:t.closed?`<div class="banner">🔒 Encerrado por <b>${e(t.closed.by.name)}</b> em ${fmt(t.closed.at)}</div>`:''}
 <div class="body">${rich(t.body)}</div>${extra}
 <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn ghost sm" onclick="like('${t.id}')">${liked?'👍 Curtiu':'👍 Curtir'} (${(t.likes||[]).length})</button>
 <button class="btn ghost sm" onclick="print()">🖨 Imprimir / PDF</button><button class="btn ghost sm" onclick="navigator.clipboard.writeText(location.href);this.textContent='✔ Link copiado'">🔗 Copiar link</button>
 ${isAdmin()&&!arch(t)?`<button class="btn ghost sm" onclick="log('${t.id}',{pinned:${!t.pinned}},'${t.pinned?'desafixou':'fixou'} o item')">${t.pinned?'Desafixar':'📌 Fixar'}</button>`:''}
 ${can&&!arch(t)?`<button class="btn ghost sm" onclick="compose('${t.type}','${t.id}')">✏ Editar</button>`:''}
 ${can&&!arch(t)?(t.closed?`<button class="btn ghost sm" onclick="log('${t.id}',{closed:null},'reabriu a discussão')">Reabrir</button>`:`<button class="btn ghost sm" onclick="log('${t.id}',{closed:{by:who(),at:Date.now()}},'encerrou a discussão')">🔒 Encerrar</button>`):''}
 ${can&&!arch(t)?`<button class="btn ghost sm" onclick="archive('${t.id}')">📦 Encerrar e arquivar</button>`:''}
 ${can&&arch(t)?`<button class="btn ghost sm" onclick="log('${t.id}',{archived:null,closed:null},'desarquivou o item')">♻ Desarquivar</button>`:''}
 ${can?`<button class="btn ghost sm danger" onclick="del('${t.id}')">Apagar</button>`:''}</div></div>
 <div class="card"><b>${(t.comments||[]).length} comentário(s)</b>${(t.comments||[]).map(c=>`<div class="cm">${av(c.author)}<div style="flex:1"><b>${e(c.author.name)}</b> <span class="meta">${ago(c.ts)}</span><div class="body" style="margin:2px 0">${rich(c.text)}</div></div>${!off&&(c.author.uid==u.uid||isAdmin())?`<button class="btn ghost sm danger noprint" onclick="delC('${t.id}','${c.id}')">✕</button>`:''}</div>`).join('')}
 ${off?'<p class="meta">🔒 Comentários desativados.</p>':`<textarea id="ct" class="f noprint" rows="3" placeholder="Escreva um comentário… use @nome para mencionar (Ctrl+Enter envia)" onkeydown="if(event.ctrlKey&&event.key=='Enter')comment('${t.id}')"></textarea><button class="btn noprint" onclick="comment('${t.id}')">Comentar</button>`}</div>
 <details class="card"><summary><b>🕘 Histórico (${(t.hist||[]).length})</b></summary><div style="margin-top:10px">${hist||'<span class="meta">Sem registros.</span>'}</div></details>`;
}

/* ---------- Ações (todas registradas no histórico) ---------- */
function log(id,p,txt){const t=T(id);store.upd(id,{...p,act:Date.now(),hist:[...(t.hist||[]),{ts:Date.now(),by:S.user.name,txt}]})}
const like=id=>{const l=T(id).likes||[],x=S.user.uid;store.upd(id,{likes:l.includes(x)?l.filter(y=>y!=x):[...l,x]})};
const vote=(id,i)=>{const t=T(id),k=S.user.uid+'|'+S.user.name,had=t.options[i].v.includes(k);
 log(id,{options:t.options.map((o,j)=>({t:o.t,v:o.v.filter(x=>x.split('|')[0]!=S.user.uid).concat(j==i&&!had?[k]:[])}))},had?'retirou o voto':`votou em “${t.options[i].t}”`)};
const done=id=>log(id,{done:{by:who(),at:Date.now()}},'marcou como concluído');
const undo=id=>log(id,{done:null},'reabriu o lembrete');
const comment=id=>{const x=$('ct').value.trim();if(!x)return;log(id,{comments:[...(T(id).comments||[]),{id:uid(),author:who(),text:x,ts:Date.now()}]},'comentou')};
const delC=(id,c)=>confirm('Apagar comentário?')&&log(id,{comments:T(id).comments.filter(x=>x.id!=c)},'apagou um comentário');
const archive=id=>{const n=prompt('Conclusão / decisão final (opcional):');if(n===null)return;const t=T(id),a={by:who(),at:Date.now(),note:n.trim()};
 log(id,{archived:a,closed:t.closed||{by:who(),at:a.at}},'encerrou e arquivou'+(n?` (${n.trim().slice(0,60)})`:''))};
const del=id=>{if(confirm('Apagar definitivamente? O histórico também será perdido.\nDica: prefira arquivar.')){store.del(id);go('')}};
let ctype='topic',eid=null;
function compose(type,id){
 eid=id||null;const t=id?T(id):{};ctype=type||ctype;
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card"><h3 style="margin-top:0">${eid?'Editar':'Novo item'}</h3>
 ${eid?'':`<div class="tabs">${Object.entries(TYPES).map(([k,v])=>`<button class="btn ${ctype==k?'':'ghost'}" onclick="compose('${k}')">${v}</button>`).join('')}</div>`}
 <input id="nt" class="f" placeholder="Título" value="${e(t.title||'')}">
 <textarea id="nb" class="f" rows="5" placeholder="Descrição / mensagem (links e @menções são destacados)">${e(t.body||'')}</textarea>
 ${ctype=='poll'&&!eid?'<textarea id="no" class="f" rows="4" placeholder="Uma opção por linha (mín. 2)"></textarea>':''}
 ${ctype=='reminder'?`<label class="meta">Prazo</label><input id="nd" type="date" class="f" value="${t.due||''}"><label class="meta">Responsável (opcional)</label>
 <select id="na" class="f"><option value="">— ninguém —</option>${people().map(([i,n])=>`<option value="${i}|${e(n)}" ${t.assignee?.uid==i?'selected':''}>${e(n)}</option>`).join('')}</select>`:''}
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" onclick="publish()">${eid?'Salvar':'Publicar'}</button></div></div></div>`;
}
const closeM=()=>$('modal').innerHTML='';
function publish(){
 const title=$('nt').value.trim(),body=$('nb').value.trim();if(!title)return alert('Informe um título.');
 const p={title,body};
 if(ctype=='reminder'){if(!$('nd').value)return alert('Informe o prazo.');p.due=$('nd').value;const a=$('na').value.split('|');p.assignee=a[0]?{uid:a[0],name:a[1]}:null}
 if(eid){log(eid,{...p,edited:Date.now()},'editou o item');closeM();return}
 const o={type:ctype,...p,author:who(),ts:Date.now(),act:Date.now(),pinned:false,closed:null,archived:null,likes:[],comments:[],hist:[{ts:Date.now(),by:S.user.name,txt:'criou o item'}]};
 if(ctype=='poll'){const op=$('no').value.split('\n').map(s=>s.trim()).filter(Boolean);if(op.length<2)return alert('Informe ao menos 2 opções.');o.options=op.map(t=>({t,v:[]}))}
 if(ctype=='reminder')o.done=null;
 store.add(o);closeM();go('');
}
addEventListener('keydown',ev=>{if(ev.key=='Escape')closeM()});
render();
</script>
</body>
</html>
