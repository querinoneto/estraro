<!--
CONFIGURAÇÃO (objeto CONFIG no início do script):
1. Firebase Console → Authentication → Método de login → ativar "E-mail/senha".
2. Authentication → Configurações → Domínios autorizados: adicione o domínio onde este arquivo for publicado.
3. Authentication → Modelos: escolha português nos e-mails de redefinição e de confirmação.
4. Firestore Database → criar → aba Regras → colar e publicar:

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function admin() {
      return request.auth != null && request.auth.token.email_verified == true
        && request.auth.token.email == 'querino.neto@gmail.com';
    }
    function approved() {
      return admin() || (request.auth != null && (
        (exists(/databases/$(database)/documents/allowed/$(request.auth.token.email.lower()))
          && get(/databases/$(database)/documents/allowed/$(request.auth.token.email.lower())).data.status == 'approved')
        || (!exists(/databases/$(database)/documents/allowed/$(request.auth.token.email.lower()))
          && exists(/databases/$(database)/documents/users/$(request.auth.uid))
          && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.approved == true)));
    }
    match /topics/{t} {
      allow read: if approved();
      allow create: if approved() && request.resource.data.get('pinned', false) == false;
      allow update: if approved() && (admin()
        || request.resource.data.get('pinned', false) == resource.data.get('pinned', false));
      allow delete: if admin();
    }
    match /allowed/{e} {
      allow read: if request.auth != null && (admin() || request.auth.token.email.lower() == e);
      allow write: if admin();
    }
    match /users/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || admin());
      allow create: if request.auth != null && request.auth.uid == u
        && request.resource.data.keys().hasOnly(['name','email','created','approved'])
        && request.resource.data.approved == false
        && request.resource.data.email == request.auth.token.email;
      allow update, delete: if admin();
    }
  }
}

5. O administrador (CONFIG.admins) deve criar a conta e confirmar o e-mail pelo link recebido.
   Novos cadastros ficam "aguardando aprovação" até o administrador liberar em 👥 Cadastros.
   A aprovação vale por e-mail (coleção "allowed"): a mesma pessoa nunca precisa ser aprovada duas vezes.
-->
<style>
:root{color-scheme:light;--g:#02b05c;--gt:#027a3f;--on:#fff;--gd:#029a50;--gl:#e9f8f0;--bg:#fff;--card:#fff;--tx:#1d2b24;--mu:#5c6e64;--bd:#d3e5d9;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font:inherit;color:inherit}a{color:var(--gt)}
header{background:#fff;color:var(--tx);border-bottom:3px solid var(--g);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 20px}
header .logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px;color:#111;cursor:pointer;white-space:nowrap}
header .logo img{height:52px;width:auto;display:block}
header .sep{width:1px;height:30px;background:var(--bd)}
header small{display:block;font-weight:400;color:var(--mu);font-size:12px}
#q{flex:1;max-width:420px;margin-left:auto;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;color:var(--tx)}
#q:focus,input.f:focus,textarea.f:focus,select.f:focus{outline:2px solid var(--g);outline-offset:0;border-color:var(--g)}
#q::placeholder{color:var(--mu)}
/* Botões: cores explícitas para garantir contraste em tema claro e escuro */
.btn{background:var(--g);color:var(--on);border:1px solid var(--g);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.ghost:hover{background:var(--gl);border-color:var(--g)}
.lnk{background:none;border:0;padding:0;color:var(--gt);text-decoration:underline;cursor:pointer;font-size:14px}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.ghost.danger,.danger{color:var(--red)!important}
.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.wrap{max-width:1080px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:240px 1fr;gap:20px}
aside .box,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
aside h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--mu);letter-spacing:.06em}
.cat{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}
.cat:hover,.cat.on{background:var(--gl)}.cat.on{color:var(--gt);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tabs .btn{padding:5px 12px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row:hover{background:var(--gl)}.row h3{margin:0;font-size:17px}.meta{font-size:13px;color:var(--mu)}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--gl);color:var(--gt);font-weight:700;margin-right:4px}
.stats{margin-left:auto;text-align:right;font-size:13px;color:var(--mu);white-space:nowrap}
.list{padding:0;overflow:hidden}.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.body{white-space:pre-wrap;word-wrap:break-word;margin:12px 0}
.opt{position:relative;display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:none;cursor:pointer;overflow:hidden;color:var(--tx)}
.opt:disabled{cursor:default;opacity:.85}
.opt i{position:absolute;left:0;top:0;bottom:0;background:var(--gl)}.opt span{position:relative;display:flex;justify-content:space-between}
.opt.me{border-color:var(--g);font-weight:700}
.cm{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
input.f,textarea.f,select.f{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:5px 0}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{width:100%;max-width:560px;max-height:92vh;overflow:auto}
.hero{text-align:center;padding:40px 20px}.hero img{width:min(340px,80%);height:auto}.hero h1{color:#111;margin:14px 0 4px}
.auth{max-width:400px;margin:22px auto 0;text-align:left}
.auth label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
.err{color:var(--red);font-weight:600;min-height:1.4em;margin:8px 0 0;font-size:14px}.err.ok{color:var(--gt)}
body.anon header{display:none}.printhead{display:none}
.due{color:var(--red);font-weight:700}.empty{text-align:center;color:var(--mu);padding:40px}
.banner{background:var(--gl);border-left:4px solid var(--g);padding:10px 14px;border-radius:8px;margin:10px 0}
.h{font-size:13px;padding:5px 0;border-left:2px solid var(--bd);padding-left:12px;margin-left:6px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--gt)}
.fab{display:none}main{min-width:0}.urow{flex-wrap:wrap}
@media(max-width:760px){
 header{flex-wrap:wrap;padding:8px 12px;gap:8px 10px}
 header small,header .sep{display:none}
 header .logo{flex:1;min-width:0;font-size:15px;gap:10px;white-space:normal;line-height:1.15}
 header .logo img{height:36px;flex:none}
 #me{order:2;margin-left:auto}#me b{display:none}
 #q{order:3;flex:1 1 100%;max-width:none;margin:0}
 .wrap{grid-template-columns:1fr;gap:0;margin:10px auto 90px;padding:0 12px}
 aside{display:contents}
 .nav-box{order:0;display:flex;flex-wrap:wrap;gap:4px;padding:6px;margin-bottom:12px}
 .nav-box h4,.newbtn{display:none}
 .nav-box .cat{width:auto;flex:none;gap:8px;white-space:nowrap;align-items:center;font-size:14px;padding:6px 10px}
 main{order:1}.rem-box{order:2;margin-top:14px}
 .stat{gap:6px}.stat div{padding:6px 2px;font-size:11px;line-height:1.25}.stat b{font-size:18px}
 .row{padding:12px 10px;gap:8px}.row h3{font-size:16px}
 .hero{padding:24px 12px}
 .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border-radius:50%;font-size:30px;line-height:1;align-items:center;justify-content:center;z-index:6;box-shadow:0 4px 14px #0003}
 body.anon .fab{display:none}
}
@media print{header,aside,.noprint,.tabs,.fab{display:none!important}.printhead{display:block;margin:0 0 14px}.printhead img{height:44px}.wrap{display:block}.card{border:0}}
</style>

  },
  async login(email,pw){
   const u=U().find(x=>x.email==email);
   if(!u||u.hash!=await hp(pw,u.salt))throw{code:'auth/invalid-credential'};
   start(u);
  },
  async reset(){throw{code:'demo/no-mail'}},
  logout(){localStorage.removeItem('lbe_sess');S.user=null;S.topics=[];cb0=null;render()},
  restore(){const s=localStorage.lbe_sess,u=s&&U().find(x=>x.uid==s);if(u)start(u)}
 };
}

/* ---------- Autenticação (formulários) ---------- */
const ERR={'auth/email-already-in-use':'Este e-mail já está cadastrado. Use “Esqueci minha senha” se necessário.','auth/invalid-email':'E-mail inválido.','auth/missing-email':'Informe seu e-mail.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','demo/no-mail':'Modo demonstração: o envio de e-mail só funciona com o Firebase conectado.','auth/weak-password':'Senha muito fraca (mínimo de 6 caracteres).','auth/operation-not-allowed':'Ative o provedor "E-mail/senha" em Authentication no Firebase.','auth/network-request-failed':'Sem conexão com a internet.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco e tente de novo.'};
const showErr=(m,ok)=>{const x=$('err');if(x){x.textContent=m;x.className='err'+(ok?' ok':'')}};
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const msg=x=>ERR[x&&x.code]||(x&&x.message)||'Erro inesperado.';
async function doLogin(ev){
 ev.preventDefault();const f=ev.target;showErr('');
 try{await auth.login(f.em.value.trim().toLowerCase(),f.pw.value)}catch(x){showErr(msg(x))}
}
async function doReg(ev){
 ev.preventDefault();const f=ev.target;showErr('');
 const name=f.nm.value.trim().replace(/\|/g,''),em=f.em.value.trim().toLowerCase(),pw=f.pw.value;
 if(name.length<2)return showErr('Informe seu nome.');
 if(!EMAIL.test(em))return showErr('Informe um e-mail válido.');
 if(pw.length<6)return showErr('A senha deve ter ao menos 6 caracteres.');
 try{await auth.register(name,em,pw)}catch(x){showErr(msg(x))}
}
async function doReset(ev){
 ev.preventDefault();const f=ev.target,em=f.em.value.trim().toLowerCase();showErr('');
 if(!EMAIL.test(em))return showErr('Informe um e-mail válido.');
 const ok=()=>showErr('Pronto! Se existir uma conta com este e-mail, enviamos um link para criar uma nova senha. Confira também a caixa de spam.',1);
 try{await auth.reset(em);ok()}catch(x){x&&x.code=='auth/user-not-found'?ok():showErr(msg(x))}
}
const setAuth=m=>{S.auth=m;render()};

/* ---------- Navegação ---------- */
const go=h=>{location.hash=h;render()};
addEventListener('hashchange',render);
const T=id=>S.topics.find(t=>t.id==id),who=()=>({uid:S.user.uid,name:S.user.name});
const people=()=>{const m={};S.topics.forEach(t=>{m[t.author.uid]=t.author.name;(t.comments||[]).forEach(c=>m[c.author.uid]=c.author.name)});m[S.user.uid]=S.user.name;return Object.entries(m)};
function render(){
 const ok=!!(S.user&&S.user.status=='ok');
 document.body.classList.toggle('anon',!ok);
 if(S.view=='cadastros'&&!isAdmin())S.view='andamento';
 $('q').style.display=ok?'':'none';
 $('me').innerHTML=ok?`<div style="display:flex;gap:10px;align-items:center">${av(S.user)}<b style="font-size:14px">${e(S.user.name.split(' ')[0])}</b><button class="btn ghost sm" onclick="auth.logout()">Sair</button></div>`:'';
 if(!S.user){
  const up=S.auth=='up',rs=S.auth=='reset';
  $('app').innerHTML=`<div class="hero"><img src="${LOGO}" alt="Liga Brasileira de Esperanto">
  <h1>Portal da Diretoria</h1>
  <div class="card auth">${rs?`<h3 style="margin:0 0 4px">Recuperar senha</h3><p class="meta" style="margin:0">Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.</p>
  <form onsubmit="doReset(event)">
   <label>E-mail</label><input class="f" name="em" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
   <div id="err" class="err"></div><button class="btn" style="width:100%;margin-top:6px">Enviar link de recuperação</button>
   <p style="text-align:center;margin:12px 0 0"><button type="button" class="lnk" onclick="setAuth('in')">← Voltar para o login</button></p></form>`
  :`<div class="tabs"><button class="btn ${up?'ghost':''}" onclick="setAuth('in')">Entrar</button><button class="btn ${up?'':'ghost'}" onclick="setAuth('up')">Criar conta</button></div>
  ${up?`<form onsubmit="doReg(event)">
   <label>Nome</label><input class="f" name="nm" autocomplete="name" required>
   <label>E-mail <span class="meta">(usado para entrar e recuperar a senha)</span></label><input class="f" name="em" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
   <label>Senha</label><input class="f" name="pw" type="password" autocomplete="new-password" required>
   <div id="err" class="err"></div><button class="btn" style="width:100%;margin-top:6px">Criar conta</button></form>`
  :`<form onsubmit="doLogin(event)">
   <label>E-mail</label><input class="f" name="em" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
   <label>Senha</label><input class="f" name="pw" type="password" autocomplete="current-password" required>
   <div id="err" class="err"></div><button class="btn" style="width:100%;margin-top:6px">Entrar</button>
   <p style="text-align:center;margin:12px 0 0"><button type="button" class="lnk" onclick="setAuth('reset')">Esqueci minha senha</button></p></form>`}`}
  </div>
  ${CONFIG.firebase?'':'<p class="meta">⚠ Modo demonstração: contas e dados salvos só neste navegador.</p>'}</div>`;return}
 if(!ok)return gate();
 const m=location.hash.match(/^#t\/(.+)/),t=m&&T(m[1]);
 if(t){const s=seen();s[t.id]=t.act||t.ts;localStorage['seen_'+S.user.uid]=JSON.stringify(s)}
 $('app').innerHTML=`<div class="wrap"><aside>${side()}</aside><main>${t?detail(t):(S.view=='cadastros'&&isAdmin()?usersPanel():list())}</main></div>`;
}
/* ---------- Aprovação de cadastros ---------- */
/* Um e-mail = uma pessoa: registros repetidos do mesmo e-mail são unidos e aprovados juntos */
const groups=()=>{
 const m={};
 (S.users||[]).filter(u=>!isAdm(u.email)).forEach(u=>{
  const k=(u.email||u.id).toLowerCase(),g=m[k]=m[k]||{email:k,name:u.name,created:0,docs:[]};
  g.docs.push(u);if(u.created&&(!g.created||u.created<g.created))g.created=u.created;
 });
 return Object.values(m).map(g=>{
  const a=(S.allowed||{})[g.email],d=g.docs;
  g.status=a?(a.status=='approved'?'ok':'rejected'):d.some(x=>x.approved)?'ok':d.some(x=>!x.rejected)?'pending':'rejected';
  return g});
};
/* Cadastros aprovados antes desta versão (sem registro por e-mail) são migrados automaticamente quando o admin abre o portal */
const healing=new Set();
const heal=()=>groups().filter(g=>g.status=='ok'&&!(S.allowed||{})[g.email]&&!healing.has(g.email)).forEach(g=>{healing.add(g.email);store.setAccess(g.email,'ok',g.docs.map(d=>d.id),true)});
const pend=()=>groups().filter(g=>g.status=='pending'),members=()=>groups().filter(g=>g.status=='ok');
const setUser=(k,st)=>{
 const g=groups().find(x=>x.email==decodeURIComponent(k));if(!g)return;
 if(st=='no'&&!confirm(`${g.status=='ok'?'Revogar o acesso de':'Recusar o cadastro de'} ${g.name}?`))return;
 store.setAccess(g.email,st,g.docs.map(d=>d.id));
};
function usersPanel(){
 const row=(g,btns)=>`<div class="row urow" style="cursor:default">${av(g)}<div style="flex:1;min-width:150px"><h3>${e(g.name)}</h3><div class="meta" style="word-break:break-all">${e(g.email)}${g.created?' · cadastro em '+fmt(g.created):''}</div></div><div style="display:flex;gap:6px">${btns}</div></div>`;
 const sec=(t,L,fn,empty)=>`<h3 style="margin:18px 0 8px">${t} <span class="meta">(${L.length})</span></h3><div class="card list">${L.length?L.map(fn).join(''):`<div class="empty" style="padding:18px">${empty}</div>`}</div>`;
 const k=g=>encodeURIComponent(g.email),rej=groups().filter(g=>g.status=='rejected');
 return `<h2 style="margin:0 0 4px">👥 Cadastros</h2><p class="meta" style="margin:0">Só quem for aprovado aqui consegue ver e participar do portal.</p>
 ${sec('⏳ Aguardando aprovação',pend(),g=>row(g,`<button class="btn sm" onclick="setUser('${k(g)}','ok')">✔ Aprovar</button><button class="btn ghost sm danger" onclick="setUser('${k(g)}','no')">Recusar</button>`),'Nenhum cadastro pendente.')}
 ${sec('✅ Com acesso',members(),g=>row(g,`<button class="btn ghost sm danger" onclick="setUser('${k(g)}','no')">Revogar acesso</button>`),'Ninguém aprovado ainda.')}
 ${rej.length?sec('🚫 Recusados',rej,g=>row(g,`<button class="btn ghost sm" onclick="setUser('${k(g)}','ok')">Aprovar</button>`),''):''}`;
}
function gate(){
 const u=S.user,st=u.status,first=e(u.name.split(' ')[0]);
 const out='<button class="btn ghost" onclick="auth.logout()">Sair</button>';
 const h=st=='verify'?`<h2 style="margin-top:0">Confirme seu e-mail</h2><p>Para ativar o acesso de administrador, abra o link que enviamos para <b>${e(u.email)}</b> e depois clique em “Já confirmei”. Confira também a caixa de spam.</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="auth.refresh().catch(x=>alert(msg(x)))">Já confirmei</button><button class="btn ghost" onclick="auth.resend().then(()=>alert('E-mail reenviado.')).catch(x=>alert(msg(x)))">Reenviar e-mail</button>${out}</div>`
 :st=='rejected'?`<h2 style="margin-top:0">Cadastro não aprovado</h2><p>Seu acesso não foi liberado. Em caso de dúvida, fale com a diretoria.</p>${out}`
 :`<h2 style="margin-top:0">Aguardando aprovação</h2><p>Olá, ${first}! Sua conta foi criada, mas um administrador precisa aprová-la antes de você acessar o portal. Esta página atualiza sozinha assim que isso acontecer.</p>${out}`;
 $('app').innerHTML=`<div class="hero"><img src="${LOGO}" alt="Liga Brasileira de Esperanto" style="width:min(260px,70%)"><div class="card auth" style="text-align:center;margin-top:20px">${h}</div></div>`;
}
/* Encerrado = arquivado. Os campos antigos (closed/done) continuam sendo reconhecidos para itens já existentes. */
const fin=t=>t.archived||t.closed||t.done||null,arch=t=>!!fin(t),isRem=t=>t.type=='reminder';
const inView=(t,v)=>v=='encerrados'?arch(t):!arch(t);
function side(){
 const rem=S.topics.filter(t=>isRem(t)&&!arch(t)&&t.due).sort((a,b)=>a.due>b.due?1:-1).slice(0,4);
 return `<button class="btn newbtn" style="width:100%;margin-bottom:14px" onclick="compose()">＋ Novo</button>
 <div class="box nav-box"><h4>Navegar</h4>${Object.entries(VIEWS).map(([k,v])=>`<button class="cat ${S.view==k?'on':''}" onclick="S.view='${k}';go('')">${v}<span class="meta">${S.topics.filter(t=>inView(t,k)).length}</span></button>`).join('')}${isAdmin()&&store.subUsers?`<button class="cat ${S.view=='cadastros'?'on':''}" onclick="S.view='cadastros';go('')">👥 Cadastros${pend().length?`<span class="tag">${pend().length} novo(s)</span>`:`<span class="meta">${members().length}</span>`}</button>`:''}</div>
 <div class="box rem-box"><h4>⏰ Próximos prazos</h4>${rem.length?rem.map(r=>`<div style="margin:6px 0;cursor:pointer" onclick="go('t/${r.id}')"><b>${e(r.title)}</b><div class="meta ${r.due<today()?'due':''}">${r.due<today()?'Vencido · ':''}${fd(r.due)}${r.assignee?' · '+e(r.assignee.name.split(' ')[0]):''}</div></div>`).join(''):'<span class="meta">Nenhum pendente 🎉</span>'}</div>`;
}
function list(){
 const q=S.q.toLowerCase(),v=S.view,sd=seen();
 let L=S.topics.filter(t=>inView(t,v)&&(S.type=='all'||t.type==S.type)&&(!q||(t.title+t.body+t.author.name+(t.comments||[]).map(c=>c.text).join(' ')).toLowerCase().includes(q)));
 L.sort((a,b)=>v=='encerrados'?fin(b).at-fin(a).at:(b.pinned?1:0)-(a.pinned?1:0)||(S.type=='reminder'?(a.due>b.due?1:-1):S.sort=='act'?(b.act||b.ts)-(a.act||a.ts):b.ts-a.ts));
 const open=S.topics.filter(t=>!arch(t)),venc=open.filter(t=>isRem(t)&&t.due<today()).length;
 return `${S.fail?`<div class="banner err">⚠ ${e(S.fail)}</div>`:''}${isAdmin()&&pend().length?`<div class="banner">👥 <b>${pend().length}</b> cadastro(s) aguardando sua aprovação. <button class="lnk" onclick="S.view='cadastros';go('')">Revisar agora</button></div>`:''}<div class="stat noprint"><div><b>${open.length}</b>em andamento</div><div><b>${open.filter(isRem).length}</b>lembretes</div><div><b class="${venc?'due':''}">${venc}</b>vencidos</div><div><b>${open.filter(t=>t.type=='poll').length}</b>enquetes abertas</div></div>
 <h2 style="margin:0 0 10px">${VIEWS[v]}</h2>
 <div class="tabs">${[['all','Todos'],['topic','💬 Tópicos'],['poll','📊 Enquetes'],['reminder','⏰ Lembretes']].map(([k,x])=>`<button class="btn ${S.type==k?'':'ghost'}" onclick="S.type='${k}';render()">${x}</button>`).join('')}
 </div>
 <div class="card list">${L.length?L.map(t=>{const un=(t.act||t.ts)>(sd[t.id]||0)&&t.author.uid!=S.user.uid||(t.act||t.ts)>(sd[t.id]||0)&&sd[t.id],f=fin(t);
 return `<div class="row" onclick="go('t/${t.id}')">${un?'<span class="dot" title="Novidades"></span>':'<span style="width:9px"></span>'}${av(t.author)}<div><h3>${t.pinned?'📌 ':''}${e(t.title)}</h3>
 <div class="meta">${TYPES[t.type]} · ${e(t.author.name)} · ${ago(t.ts)}${t.due?` · prazo <span class="${!f&&t.due<today()?'due':''}">${fd(t.due)}</span>`:''}${t.assignee?' · 👤 '+e(t.assignee.name):''}${f?` · 📦 ${e(f.by.name)}, ${fmt(f.at)}`:''}</div></div>
 <div class="stats">💬 ${(t.comments||[]).length}</div></div>`}).join(''):'<div class="empty">Nada por aqui ainda.</div>'}</div>`;
}
function detail(t){
 const u=S.user,can=isAdmin()||t.author.uid==u.uid,off=arch(t),f=fin(t);
 let extra='';
 if(t.type=='poll'){const tot=t.options.reduce((s,o)=>s+o.v.length,0);
  extra=t.options.map((o,i)=>`<button class="opt ${o.v.some(x=>x.startsWith(u.uid+'|'))?'me':''}" ${off?'disabled':''} onclick="vote('${t.id}',${i})"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span>${e(o.t)}<b>${o.v.length} voto(s)</b></span></button>`).join('')+`<div class="meta">${tot} voto(s) · votos nominais${t.options.map(o=>o.v.length?`<br>${e(o.t)}: ${o.v.map(x=>e(x.split('|')[1])).join(', ')}`:'').join('')}</div>`}
 if(isRem(t))extra=`<p>📅 Prazo: <b class="${!off&&t.due<today()?'due':''}">${fd(t.due)}</b>${t.assignee?` · 👤 Responsável: <b>${e(t.assignee.name)}</b>`:''}</p>
  ${off?'':`<button class="btn" onclick="finish('${t.id}','Lembrete concluído.')">✔ Marcar como concluído</button>`}`;
 const hist=[...(t.hist||[])].reverse().map(h=>`<div class="h"><b>${e(h.by)}</b> ${e(h.txt)} <span class="meta">· ${fmt(h.ts)}</span></div>`).join('');
 return `<button class="btn ghost sm noprint" onclick="go('')">← Voltar</button>
 <div class="card" style="margin-top:12px"><div style="display:flex;gap:12px;align-items:center">${av(t.author)}<div>${TYPES[t.type]}<div class="meta">${e(t.author.name)} · ${fmt(t.ts)}</div></div></div>
 <h2>${t.pinned?'📌 ':''}${e(t.title)}</h2>
 ${off?`<div class="banner">📦 Encerrado e arquivado por <b>${e(f.by.name)}</b> em ${fmt(f.at)}${f.note?`<br><b>Conclusão:</b> ${rich(f.note)}`:''}</div>`:''}
 <div class="body">${rich(t.body)}</div>${extra}
 <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
 <button class="btn ghost sm" onclick="print()">🖨 Imprimir / PDF</button><button class="btn ghost sm" onclick="navigator.clipboard.writeText(location.href);this.textContent='✔ Link copiado'">🔗 Copiar link</button>
 ${isAdmin()&&!off?`<button class="btn ghost sm" onclick="log('${t.id}',{pinned:${!t.pinned}},'${t.pinned?'desafixou':'fixou'} o item')">${t.pinned?'Desafixar':'📌 Fixar'}</button>`:''}
 ${can&&!off?`<button class="btn ghost sm" onclick="archive('${t.id}')">📦 Encerrar</button>`:''}
 ${isAdmin()?`<button class="btn ghost sm danger" onclick="del('${t.id}')">Apagar</button>`:''}</div></div>
 <div class="card"><b>${(t.comments||[]).length} comentário(s)</b>${(t.comments||[]).map(c=>`<div class="cm">${av(c.author)}<div style="flex:1"><b>${e(c.author.name)}</b> <span class="meta">${ago(c.ts)}</span><div class="body" style="margin:2px 0">${rich(c.text)}</div></div>${!off&&(c.author.uid==u.uid||isAdmin())?`<button class="btn ghost sm danger noprint" onclick="delC('${t.id}','${c.id}')">✕</button>`:''}</div>`).join('')}
 ${off?'<p class="meta">🔒 Item encerrado: comentários desativados.</p>':`<textarea id="ct" class="f noprint" rows="3" placeholder="Escreva um comentário… use @nome para mencionar (Ctrl+Enter envia)" onkeydown="if(event.ctrlKey&&event.key=='Enter')comment('${t.id}')"></textarea><button class="btn noprint" onclick="comment('${t.id}')">Comentar</button>`}</div>
 <details class="card"><summary><b>🕘 Histórico (${(t.hist||[]).length})</b></summary><div style="margin-top:10px">${hist||'<span class="meta">Sem registros.</span>'}</div></details>`;
}

/* ---------- Ações (todas registradas no histórico) ---------- */
function log(id,p,txt){if('pinned' in p&&!isAdmin())return;const t=T(id);store.upd(id,{...p,act:Date.now(),hist:[...(t.hist||[]),{ts:Date.now(),by:S.user.name,txt}]})}
const vote=(id,i)=>{const t=T(id);if(arch(t))return;const k=S.user.uid+'|'+S.user.name,had=t.options[i].v.includes(k);
 log(id,{options:t.options.map((o,j)=>({t:o.t,v:o.v.filter(x=>x.split('|')[0]!=S.user.uid).concat(j==i&&!had?[k]:[])}))},had?'retirou o voto':`votou em “${t.options[i].t}”`)};
const comment=id=>{const x=$('ct').value.trim();if(!x)return;log(id,{comments:[...(T(id).comments||[]),{id:uid(),author:who(),text:x,ts:Date.now()}]},'comentou')};
const delC=(id,c)=>confirm('Apagar comentário?')&&log(id,{comments:T(id).comments.filter(x=>x.id!=c)},'apagou um comentário');
/* Encerrar = arquivar (ação única e definitiva) */
const finish=(id,note)=>log(id,{archived:{by:who(),at:Date.now(),note:note||''}},'encerrou e arquivou'+(note?` (${note.slice(0,60)})`:''));
const archive=id=>{const n=prompt('Encerrar e arquivar este item.\nConclusão / decisão final (opcional):');if(n===null)return;finish(id,n.trim())};
const del=id=>{if(!isAdmin())return;if(confirm('Apagar definitivamente? O histórico também será perdido.\nDica: prefira encerrar.')){store.del(id);go('')}};
let ctype='topic';
function compose(type){
 ctype=type||ctype;
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card"><h3 style="margin-top:0">Novo item</h3>
 <div class="tabs">${Object.entries(TYPES).map(([k,v])=>`<button class="btn ${ctype==k?'':'ghost'}" onclick="compose('${k}')">${v}</button>`).join('')}</div>
 <input id="nt" class="f" placeholder="Título">
 <textarea id="nb" class="f" rows="5" placeholder="Descrição / mensagem (links e @menções são destacados)"></textarea>
 ${ctype=='poll'?'<textarea id="no" class="f" rows="4" placeholder="Uma opção por linha (mín. 2)"></textarea>':''}
 ${ctype=='reminder'?`<label class="meta">Prazo</label><input id="nd" type="date" class="f"><label class="meta">Responsável (opcional)</label>
 <select id="na" class="f"><option value="">— ninguém —</option>${people().map(([i,n])=>`<option value="${i}|${e(n)}">${e(n)}</option>`).join('')}</select>`:''}
 <p class="meta">Atenção: depois de publicado, o item não pode ser editado.</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" onclick="publish()">Publicar</button></div></div></div>`;
}
const closeM=()=>$('modal').innerHTML='';
function publish(){
 const title=$('nt').value.trim(),body=$('nb').value.trim();if(!title)return alert('Informe um título.');
 const o={type:ctype,title,body,author:who(),ts:Date.now(),act:Date.now(),pinned:false,archived:null,comments:[],hist:[{ts:Date.now(),by:S.user.name,txt:'criou o item'}]};
 if(ctype=='reminder'){if(!$('nd').value)return alert('Informe o prazo.');o.due=$('nd').value;const a=$('na').value.split('|');o.assignee=a[0]?{uid:a[0],name:a[1]}:null}
 if(ctype=='poll'){const op=$('no').value.split('\n').map(s=>s.trim()).filter(Boolean);if(op.length<2)return alert('Informe ao menos 2 opções.');o.options=op.map(t=>({t,v:[]}))}
 store.add(o);closeM();S.view='andamento';go('');
}
addEventListener('keydown',ev=>{if(ev.key=='Escape')closeM()});
auth.restore&&auth.restore();
render();
</script>
