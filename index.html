<!--
CONFIGURAÇÃO (objeto CONFIG no início do script):
1. Firebase Console → Authentication → Método de login → ativar "E-mail/senha".
2. Authentication → Configurações → Domínios autorizados: deixe só o domínio onde este arquivo é publicado.
3. Authentication → Configurações → Política de senha: exija ao menos 8 caracteres; mantenha a proteção contra enumeração de e-mails ligada.
4. Authentication → Modelos: escolha português nos e-mails de redefinição e de confirmação.
5. Firestore Database → criar → aba Regras → colar TODO o conteúdo do arquivo firestore.rules e publicar.
   (As regras usam subcoleções: topics/{id}/comments, /votes e /hist. Itens antigos continuam legíveis, só para leitura.)
6. Google Cloud Console → APIs e serviços → Credenciais → chave de navegador: restringir por "Referenciadores HTTP" ao seu domínio.
7. O administrador (CONFIG.admins) deve criar a conta e confirmar o e-mail pelo link recebido.
   TODOS os cadastros precisam confirmar o e-mail; os não-admin também ficam "aguardando aprovação" até o administrador liberar em 👥 Cadastros.
   A aprovação vale por e-mail (coleção "allowed"): a mesma pessoa nunca precisa ser aprovada duas vezes.
8. Fotos de perfil (coleção "avatars"), diretório de pessoas ("people"), menções/notificações ("notifs")
   e anexos em PDF/imagem ("files", guardados em pedaços no próprio Firestore — não precisa do Firebase Storage).
   Tudo isso já está coberto pelo firestore.rules: basta colar e publicar a versão mais recente.
-->
<style>
:root{color-scheme:light;--g:#02b05c;--gt:#027a3f;--on:#fff;--gd:#029a50;--gl:#e9f8f0;--bg:#fff;--card:#fff;--tx:#1d2b24;--mu:#5c6e64;--bd:#d3e5d9;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font:inherit;color:inherit}a{color:var(--gt)}
header{background:#fff;color:var(--tx);border-bottom:3px solid var(--g);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 20px}
header .logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:18px;color:#111;cursor:pointer;white-space:nowrap}
header .logo img{height:52px;width:auto;display:block}
header .sep{width:1px;height:30px;background:var(--bd)}
header small{display:block;font-weight:400;color:var(--mu);font-size:12px}
#q{flex:1;max-width:420px;margin-left:auto;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;color:var(--tx)}
#q:focus,input.f:focus,textarea.f:focus,select.f:focus{outline:2px solid var(--g);outline-offset:0;border-color:var(--g)}
#q::placeholder{color:var(--mu)}
/* Botões: cores explícitas para garantir contraste em tema claro e escuro */
.btn{background:var(--g);color:var(--on);border:1px solid var(--g);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--gd);border-color:var(--gd)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.ghost:hover{background:var(--gl);border-color:var(--g)}
.lnk{background:none;border:0;padding:0;color:var(--gt);text-decoration:underline;cursor:pointer;font-size:14px}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.ghost.danger,.danger{color:var(--red)!important}
.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:128px;height:128px;font-size:52px}
button.avb{background:none;border:0;padding:0;border-radius:50%;cursor:pointer;display:inline-flex}
button.avb:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.av.sm{width:26px;height:26px;font-size:12px}
.bell{position:relative;font-size:16px;padding:3px 9px}.bell .n{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;line-height:16px;min-width:16px;padding:0 4px;font-weight:700}
.att{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.att:empty{display:none}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;background:var(--card);color:var(--tx);cursor:pointer;font-size:14px;max-width:100%;word-break:break-all;text-align:left}
.chip:hover{border-color:var(--g)}
button.thumb{background:none;border:0;padding:0;cursor:pointer}button.thumb img{width:140px;height:105px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);display:block}
#mbox{position:fixed;z-index:20;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 18px #0003;max-height:260px;overflow:auto;min-width:240px;max-width:calc(100vw - 16px)}
#mbox button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:7px 10px;text-align:left;cursor:pointer;color:var(--tx);line-height:1.25}
#mbox button.on,#mbox button:hover{background:var(--gl)}
.cm.flash{background:var(--gl);border-radius:8px;box-shadow:0 0 0 6px var(--gl)}
.cm>button{align-self:flex-start}
.pick{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;margin:5px 0}.pick label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
.who{display:inline-flex;gap:6px;align-items:center;background:var(--gl);border-radius:16px;padding:2px 10px 2px 2px;font-size:14px}
.st{font-size:12px;padding:1px 8px;border-radius:10px;font-weight:700;white-space:nowrap;background:#eef1ef;color:var(--mu)}
.st-doing{background:#e6efff;color:#1d4ed8}.st-done{background:var(--gl);color:var(--gt)}
.removed{color:var(--mu);font-style:italic;margin:2px 0}
.wrap{max-width:1080px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:240px 1fr;gap:20px}
aside .box,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
aside h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--mu);letter-spacing:.06em}
.cat{display:flex;justify-content:space-between;width:100%;background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}
.cat:hover,.cat.on{background:var(--gl)}.cat.on{color:var(--gt);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tabs .btn{padding:5px 12px;font-size:14px}
.row{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row:hover{background:var(--gl)}.row h3{margin:0;font-size:17px}.meta{font-size:13px;color:var(--mu)}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--gl);color:var(--gt);font-weight:700;margin-right:4px}
.stats{margin-left:auto;text-align:right;font-size:13px;color:var(--mu);white-space:nowrap}
.list{padding:0;overflow:hidden}.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.body{white-space:pre-wrap;word-wrap:break-word;margin:12px 0}
.opt{position:relative;display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:none;cursor:pointer;overflow:hidden;color:var(--tx)}
.opt:disabled{cursor:default;opacity:.85}
.opt i{position:absolute;left:0;top:0;bottom:0;background:var(--gl)}.opt span{position:relative;display:flex;justify-content:space-between}
.opt.me{border-color:var(--g);font-weight:700}
.cm{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}
input.f,textarea.f,select.f{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:5px 0}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal .card{width:100%;max-width:560px;max-height:92vh;overflow:auto}
.hero{text-align:center;padding:40px 20px}.hero img{width:min(340px,80%);height:auto}.hero h1{color:#111;margin:14px 0 4px}
.auth{max-width:400px;margin:22px auto 0;text-align:left}
.auth label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
.err{color:var(--red);font-weight:600;min-height:1.4em;margin:8px 0 0;font-size:14px}.err.ok{color:var(--gt)}
body.anon header{display:none}.printhead{display:none}
.due{color:var(--red);font-weight:700}.empty{text-align:center;color:var(--mu);padding:40px}
.banner{background:var(--gl);border-left:4px solid var(--g);padding:10px 14px;border-radius:8px;margin:10px 0}
.h{font-size:13px;padding:5px 0;border-left:2px solid var(--bd);padding-left:12px;margin-left:6px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--gt)}
.fab{display:none}main{min-width:0}.urow{flex-wrap:wrap}
@media(max-width:760px){
 header{flex-wrap:wrap;padding:8px 12px;gap:8px 10px}
 header small,header .sep{display:none}
 header .logo{flex:1;min-width:0;font-size:15px;gap:10px;white-space:normal;line-height:1.15}
 header .logo img{height:36px;flex:none}
 #me{order:2;margin-left:auto}#me b{display:none}
 #q{order:3;flex:1 1 100%;max-width:none;margin:0}
 .wrap{grid-template-columns:1fr;gap:0;margin:10px auto 90px;padding:0 12px}
 aside{display:contents}
 .nav-box{order:0;display:flex;flex-wrap:wrap;gap:4px;padding:6px;margin-bottom:12px}
 .nav-box h4,.newbtn{display:none}
 .nav-box .cat{width:auto;flex:none;gap:8px;white-space:nowrap;align-items:center;font-size:14px;padding:6px 10px}
 main{order:1}.rem-box{order:2;margin-top:14px}
 .stat{gap:6px}.stat div{padding:6px 2px;font-size:11px;line-height:1.25}.stat b{font-size:18px}
 .row{padding:12px 10px;gap:8px}.row h3{font-size:16px}
 .hero{padding:24px 12px}
 .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border-radius:50%;font-size:30px;line-height:1;align-items:center;justify-content:center;z-index:6;box-shadow:0 4px 14px #0003}
 body.anon .fab{display:none}
}
@media print{header,aside,.noprint,.tabs,.fab{display:none!important}.printhead{display:block;margin:0 0 14px}.printhead img{height:44px}.wrap{display:block}.card{border:0}}
</style>
</head>
<body>
<header>
 <div class="logo" onclick="go('')"><img id="hl" alt="Liga Brasileira de Esperanto"><span class="sep"></span><div>Portal da Diretoria<small>espaço interno</small></div></div>
 <input id="q" placeholder="Buscar" oninput="S.q=this.value;if(location.hash)go('');else render();$('q').focus()">
 <div id="me"></div>
</header>
<div class="printhead"><img id="pl" alt="Liga Brasileira de Esperanto"></div>
<div id="app"></div>
<button class="btn fab" aria-label="Novo item" onclick="compose()">＋</button>
<div id="modal"></div>
<div id="mbox" role="listbox" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

async function prep(f){

  if(f.size>MAXB)throw new Error('PDF grande demais (máx. 10 MB).');
  return{name:f.name,type:'application/pdf',size:f.size,blob:f}}
 if(!/^image\//.test(f.type))throw new Error('só é possível anexar PDFs e imagens.');

 const blob=await new Promise(r=>cv(2000).toBlob(r,'image/jpeg',.85));
 if(!blob)throw new Error('não foi possível processar a imagem.');
 if(blob.size>MAXB)throw new Error('imagem grande demais.');

 ${isAdmin()&&!off?`<button class="btn ghost sm" onclick="pin('${i0}')">${t.pinned?'Desafixar':'📌 Fixar'}</button>`:''}
 ${can&&!off?`<button class="btn ghost sm" onclick="archive('${i0}')">📦 Encerrar</button>`:''}
 ${isAdmin()?`<button class="btn ghost sm danger" onclick="del('${i0}')">Apagar</button>`:''}</div></div>
 ${showC?`<div class="card"><b>${cm.length} comentário(s)</b>${cm.map(c=>cmH(c,i0)).join('')}
 ${t.type=='poll'?'<p class="meta">💬 Enquetes não recebem comentários.</p>':off?'<p class="meta">🔒 Item encerrado: comentários desativados.</p>':composerC(i0)}</div>`:''}
 <details class="card"><summary><b>🕘 Histórico (${hl.length})</b></summary><div style="margin-top:10px">${hist||'<span class="meta">Sem registros.</span>'}</div></details>`;
}

/* ---------- Ações ----------
   Toda ação grava, numa única operação atômica: (1) a mudança, (2) a hora de atividade do item
   e (3) uma linha no histórico. As horas vêm do servidor, nunca do relógio do navegador. */
function act(id,upd,txt,more){
 const tr=col.doc(id),b=db.batch();
 b.update(tr,{...upd,act:TS()});
 b.set(tr.collection('hist').doc(),{by:who(),txt:String(txt).slice(0,300),ts:TS()});
 more&&more(b,tr);
 return b.commit().then(()=>true,x=>{saveFail(x);return false});
}
/* Escolha única: um clique marca (e troca) a opção. Múltipla: cada clique marca/desmarca aquela opção. */
const vote=(id,i)=>{const t=T(id);if(!t||arch(t)||!t.options||!t.options[i])return;
 const me=S.votes.find(v=>v.id==S.user.uid),cur=me?vopts(me):[],has=cur.includes(i),lbl=`“${String(t.options[i].t).slice(0,80)}”`;
 const nx=t.multi?(has?cur.filter(x=>x!==i):[...cur,i].sort((a,b)=>a-b)):(has?[]:[i]);
 act(id,{},(has?'retirou o voto em ':'votou em ')+lbl,(b,tr)=>{const r=tr.collection('votes').doc(S.user.uid);
  nx.length?b.set(r,{name:S.user.name,opts:nx,ts:TS()}):b.delete(r)})};
async function comment(id){
 const el=$('ct'),t=T(id);if(!el||!t||t.type=='poll'||S.busy)return;
 const x=el.value.trim(),fl=S.catt.tid==id?S.catt.list:[];
 if(!x&&!fl.length)return;
 if(x.length>5000)return alert('Comentário muito longo (máx. 5000 caracteres).');
 S.draft={id,v:el.value,f:false};S.busy=true;render();
 try{
  const files=await upAll(fl);
  const ok=await act(id,{},'comentou',(b,tr)=>{const r=tr.collection('comments').doc();
   b.set(r,{author:who(),text:x,files,ts:TS()});
   notify(b,{tid:id,cid:r.id,title:t.title,text:x||'(anexo)'},mentionsIn(x))});
  if(ok){S.draft=null;S.catt={tid:null,list:[]};const c=$('ct');if(c)c.value=''}
 }catch(err){saveFail(err)}
 finally{S.busy=false;render()}
}
/* Só o administrador remove comentários; fica o aviso "removido pelo administrador" */
async function delC(id,cid){
 if(!isAdmin())return;
 const t=T(id),c=(S.comments[id]||[]).find(x=>x.id==cid);if(!t||!c)return;
 if(!confirm('Remover este comentário?\nNo lugar dele ficará o aviso “Comentário removido pelo administrador”.'))return;
 const tr=col.doc(id),b=db.batch();
 b.update(tr.collection('comments').doc(cid),{text:'',files:[],removed:{by:who(),at:TS()}});
 if(!(t.archived||t.closed||t.done))b.update(tr,{act:TS()});
 b.set(tr.collection('hist').doc(),{by:who(),txt:'removeu um comentário (administrador)',ts:TS()});
 try{await b.commit();rmFiles(c.files)}catch(x){saveFail(x)}
}
const pin=id=>{if(!isAdmin())return;const t=T(id);if(!t)return;act(id,{pinned:!t.pinned},t.pinned?'desafixou o item':'fixou o item')};
/* Encerrar = arquivar (ação única e definitiva) */
const finish=(id,note)=>act(id,{archived:{by:who(),at:TS(),note:note||''}},'encerrou e arquivou'+(note?` (${note.slice(0,60)})`:''));
async function archive(id){
 const t=T(id);if(!t)return;
 if(t.type=='poll'){
  let vs;try{vs=(await col.doc(id).collection('votes').get()).docs.map(dat)}catch(x){return saveFail(x)}
  const r=pollResult(t,vs);
  if(!confirm('Encerrar e arquivar esta enquete agora?\n\nConclusão (definida pela opção mais votada):\n'+r))return;
  return finish(id,r);
 }
 const n=prompt('Encerrar e arquivar este item.\nConclusão / decisão final (opcional):');if(n===null)return;
 if(n.trim().length>2000)return alert('Conclusão muito longa (máx. 2000 caracteres).');finish(id,n.trim());
}
/* Apagar: remove também comentários, votos, histórico e anexos do item (subcoleções não somem sozinhas) */
async function del(id){
 if(!isAdmin())return;
 if(!confirm('Apagar definitivamente? Comentários, votos, histórico e anexos também serão perdidos.\nDica: prefira encerrar.'))return;
 const tr=col.doc(id),t=T(id),fl=[...((t&&Array.isArray(t.files))?t.files:[])];
 try{
  for(const c of ['comments','votes','hist']){
   const s=await tr.collection(c).get();
   if(c=='comments')s.docs.forEach(d=>{const x=d.data().files;if(Array.isArray(x))fl.push(...x)});
   for(let i=0;i<s.docs.length;i+=400){const b=db.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
  }
  await tr.delete();go('');rmFiles(fl);
 }catch(x){saveFail(x)}
}
let ctype='topic';
function compose(type){
 const keep=type&&$('nt')?{t:$('nt').value,b:$('nb').value}:null;
 if(!type)S.natt=[];
 ctype=type||ctype;
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card"><h3 style="margin-top:0">Novo item</h3>
 <div class="tabs">${Object.entries(TYPES).map(([k,v])=>`<button class="btn ${ctype==k?'':'ghost'}" onclick="compose('${k}')">${v}</button>`).join('')}</div>
 <input id="nt" class="f" maxlength="200" placeholder="Título">
 <textarea id="nb" class="f" rows="5" maxlength="10000" placeholder="Descrição / mensagem — digite @ para mencionar alguém ou @todos para avisar todos" oninput="mq(this)" onkeydown="mk(event)" onblur="setTimeout(mclose,200)"></textarea>
 <div class="att" id="natt"></div>
 <input id="nf" type="file" hidden multiple accept="application/pdf,image/*" onchange="pick(this,'nb')">
 <button class="btn ghost sm" onclick="$('nf').click()">📎 Anexar PDF ou imagem</button>
 ${ctype=='poll'?`<textarea id="no" class="f" rows="4" placeholder="Uma opção por linha (mín. 2, máx. 20)" style="margin-top:10px"></textarea>
 <div style="display:flex;gap:16px;flex-wrap:wrap;margin:6px 0"><label><input type="radio" name="mu" value="0" checked> Escolha única</label><label><input type="radio" name="mu" value="1"> Múltipla escolha</label></div>
 <label class="meta">Encerrar automaticamente em (opcional)</label><input id="ne" type="datetime-local" class="f">
 <p class="meta" style="margin:0">Ao encerrar (no prazo ou manualmente), a conclusão será a opção mais votada. Enquetes não recebem comentários.</p>`:''}
 ${ctype=='reminder'?`<label class="meta" style="display:block;margin-top:10px">Prazo</label><input id="nd" type="date" class="f"><label class="meta">Responsáveis (opcional; marque uma ou mais pessoas)</label>
 <div class="pick">${dir().map(([i,n])=>`<label><input type="checkbox" name="na" value="${e(i)}"> ${av({uid:i,name:n},'sm')} ${e(n)}${i==S.user.uid?' <span class="meta">(você)</span>':''}</label>`).join('')||'<span class="meta">Nenhuma pessoa no diretório ainda.</span>'}</div>
 <p class="meta" style="margin:0">Só os responsáveis atualizam o status (a fazer, em andamento, concluída). Sem responsável, quem atualiza é você.</p>`:''}
 <p class="meta">Atenção: depois de publicado, o item não pode ser editado.</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" id="pbtn" onclick="publish()">Publicar</button></div></div></div>`;
 if(keep){$('nt').value=keep.t;$('nb').value=keep.b}
 drawNatt();
}
const closeM=()=>{mclose();$('modal').innerHTML=''};
async function publish(){
 if(S.busy)return;
 const title=$('nt').value.trim(),body=$('nb').value.trim();if(!title)return alert('Informe um título.');
 if(title.length>200||body.length>10000)return alert('Texto longo demais.');
 const tr=col.doc(),o={type:ctype,title,body,author:who(),ts:TS(),act:TS(),pinned:false,archived:null};
 let extra=null;
 if(ctype=='reminder'){
  if(!$('nd').value)return alert('Informe o prazo.');o.due=$('nd').value;
  const ids=[...document.querySelectorAll('input[name="na"]:checked')].map(x=>x.value).filter(i=>S.people[i]).slice(0,20);
  o.assignees=ids.map(i=>({uid:i,name:S.people[i].name}));o.aids=ids;o.status='todo';
  if(ids.length){extra={};ids.forEach(i=>extra[i]='assign')}}
 if(ctype=='poll'){
  const op=$('no').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(op.length<2)return alert('Informe ao menos 2 opções.');
  if(op.length>20||op.some(s=>s.length>200))return alert('No máximo 20 opções, de até 200 caracteres cada.');
  o.options=op.map(t=>({t}));
  const mu=document.querySelector('input[name="mu"]:checked');o.multi=!!(mu&&mu.value=='1');
  const ev=$('ne').value;
  if(ev){const w=new Date(ev).getTime();if(!(w>Date.now()+6e4))return alert('O prazo da enquete precisa ser uma data e hora no futuro.');o.ends=firebase.firestore.Timestamp.fromMillis(w)}
  else o.ends=null}
 S.busy=true;const pb=$('pbtn');if(pb){pb.disabled=true;pb.textContent='Publicando…'}
 try{
  o.files=await upAll(S.natt);
  const b=db.batch();
  b.set(tr,o);
  b.set(tr.collection('hist').doc(),{by:who(),txt:'criou o item',ts:TS()});
  notify(b,{tid:tr.id,cid:null,title,text:body},mentionsIn(title+'\n'+body),extra);
  await b.commit();
  S.natt=[];closeM();S.view='andamento';go('');
 }catch(x){saveFail(x)}
 finally{S.busy=false;const p=$('pbtn');if(p){p.disabled=false;p.textContent='Publicar'}}
}
addEventListener('keydown',ev=>{if(ev.key=='Escape')closeM()});

/* ---------- Meu perfil: nome e foto ----------
   A foto é recortada em quadrado e reduzida a 256×256 px (JPEG) no próprio navegador
   e gravada em avatars/{uid}. Nada é enviado antes de a pessoa escolher o arquivo. */
function profile(){
 const has=!!S.avatars[S.user.uid];
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="card" style="max-width:420px;text-align:center"><h3 style="margin-top:0">Meu perfil</h3>
 <div style="display:flex;justify-content:center;margin:10px 0">${av(S.user,'xl')}</div>
 <input id="pf" type="file" accept="image/*" hidden onchange="setPhoto(this)">
 <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
  <button class="btn ghost sm" onclick="$('pf').click()">${has?'Trocar foto':'Escolher foto'}</button>
  ${has?'<button class="btn ghost sm danger" onclick="delPhoto()">Remover foto</button>':''}</div>
 <p class="meta" style="margin:8px 0 14px">A foto é recortada em quadrado e reduzida automaticamente.</p>
 <label class="meta" style="display:block;text-align:left">Seu nome (como aparece no portal)</label>
 <div style="display:flex;gap:8px;align-items:center"><input id="pn" class="f" maxlength="80" autocomplete="name" value="${e(S.user.name)}" onkeydown="if(event.key=='Enter')saveName()"><button class="btn" onclick="saveName()">Salvar</button></div>
 <div id="err" class="err" style="margin:4px 0 8px"></div>
 <button class="btn ghost" onclick="closeM()">Fechar</button></div></div>`;
}
async function saveName(){
 const n=cleanName($('pn').value);showErr('');
 if(n.length<2)return showErr('Informe seu nome (ao menos 2 caracteres).');
 if(n.length>80)return showErr('Nome muito longo (máx. 80 caracteres).');
 if(n===S.user.name)return showErr('Nenhuma alteração.',1);
 try{
  const ur=db.collection('users').doc(S.user.uid),ex=(await ur.get()).exists,b=db.batch();
  ex?b.update(ur,{name:n}):b.set(ur,{name:n,email:S.user.email,created:Date.now(),approved:false});
  b.set(db.collection('people').doc(S.user.uid),{name:n,ts:TS()});
  await b.commit();
  S.user.name=n;wroteName=n;render();profile();showErr('Nome atualizado.',1);
 }catch(x){showErr(x&&x.code=='permission-denied'?'Sem permissão para alterar o nome (verifique se as regras novas foram publicadas no Firestore).':msg(x))}
}
async function setPhoto(inp){
 const f=inp.files&&inp.files[0];inp.value='';if(!f)return;showErr('');
 if(!/^image\//.test(f.type))return showErr('Escolha um arquivo de imagem.');
 if(f.size>15e6)return showErr('Imagem grande demais (máx. 15 MB).');
 try{
  showErr('Enviando…',1);
  const i=await loadImg(f),n=Math.min(i.naturalWidth,i.naturalHeight),c=document.createElement('canvas');
  if(!n)throw new Error('Imagem inválida.');
  c.width=c.height=256;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,256,256); /* PNG com transparência fica com fundo branco */
  x.drawImage(i,(i.naturalWidth-n)/2,(i.naturalHeight-n)/2,n,n,0,0,256,256);
  let d,q=.85;do{d=c.toDataURL('image/jpeg',q);q-=.15}while(d.length>150000&&q>.2);
  if(!IMG.test(d)||d.length>=200000)throw new Error('Não foi possível processar a imagem.');
  await db.collection('avatars').doc(S.user.uid).set({img:d,ts:TS()});
  S.avatars[S.user.uid]=d;render();profile();
 }catch(x){showErr(x&&x.code=='permission-denied'?'Sem permissão para salvar a foto (verifique se as regras da coleção "avatars" foram publicadas no Firestore).':msg(x))}
}
async function delPhoto(){
 if(!confirm('Remover sua foto de perfil?'))return;
 try{await db.collection('avatars').doc(S.user.uid).delete();delete S.avatars[S.user.uid];render();profile()}
 catch(x){showErr(x&&x.code=='permission-denied'?'Sem permissão para remover a foto.':msg(x))}
}
render();
</script>
